---
- name: Install and Configure SonarQube
  hosts: all
  become: yes
  vars:
    sonarqube_dir: "/opt/sonarqube"

  tasks:
    - name: Set vm.max_map_count kernel parameter for SonarQube
      sysctl:
        name: vm.max_map_count
        value: '524288'
        state: present
        reload: yes

    - name: Set fs.file-max kernel parameter
      sysctl:
        name: fs.file-max
        value: '131072'
        state: present
        reload: yes

    - name: Create SonarQube directory
      file:
        path: "{{ sonarqube_dir }}"
        state: directory
        mode: '0755'

    - name: Create Docker Compose file for SonarQube
      copy:
        dest: "{{ sonarqube_dir }}/docker-compose.yml"
        mode: '0644'
        content: |
          services:
            sonarqube:
              image: sonarqube:lts-community
              container_name: sonarqube
              restart: unless-stopped
              ports:
                - "9000:9000"
              environment:
                - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
              volumes:
                - sonarqube_data:/opt/sonarqube/data
                - sonarqube_extensions:/opt/sonarqube/extensions
                - sonarqube_logs:/opt/sonarqube/logs

          volumes:
            sonarqube_data:
            sonarqube_extensions:
            sonarqube_logs:

    - name: Start SonarQube container using Docker Compose
      command: docker compose up -d
      args:
        chdir: "{{ sonarqube_dir }}"

    - name: Wait for SonarQube to listen on port 9000
      wait_for:
        port: 9000
        delay: 5
        timeout: 90
