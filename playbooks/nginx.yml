---
- name: Install and Configure Nginx
  hosts: all
  become: yes

  tasks:
    - name: Install Nginx web server
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Start and enable Nginx service
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Deploy custom index.html page
      copy:
        dest: /var/www/html/index.html
        content: |
          <h1>Welcome to Nginx deployed via Ansible!</h1>
        mode: '0644'
