---
- name: Install and Configure Prometheus & Grafana
  hosts: all
  become: yes
  vars:
    monitoring_dir: "/opt/monitoring"

  tasks:
    - name: Create monitoring directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ monitoring_dir }}"
        - "{{ monitoring_dir }}/prometheus"
        - "{{ monitoring_dir }}/grafana/provisioning/datasources"

    - name: Configure Prometheus scrape targets
      copy:
        dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
        mode: '0644'
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['prometheus:9090']

    - name: Configure Grafana Prometheus Datasource
      copy:
        dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/datasource.yml"
        mode: '0644'
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true

    - name: Create Docker Compose file for Prometheus & Grafana
      copy:
        dest: "{{ monitoring_dir }}/docker-compose.yml"
        mode: '0644'
        content: |
          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: prometheus
              restart: unless-stopped
              ports:
                - "9090:9090"
              volumes:
                - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
                - prometheus_data:/prometheus

            grafana:
              image: grafana/grafana:latest
              container_name: grafana
              restart: unless-stopped
              ports:
                - "3000:3000"
              environment:
                - GF_SECURITY_ADMIN_USER=admin
                - GF_SECURITY_ADMIN_PASSWORD=admin
              volumes:
                - grafana_data:/var/lib/grafana
                - ./grafana/provisioning:/etc/grafana/provisioning
              depends_on:
                - prometheus

          volumes:
            prometheus_data:
            grafana_data:

    - name: Start Prometheus and Grafana containers
      command: docker compose up -d
      args:
        chdir: "{{ monitoring_dir }}"

    - name: Wait for Prometheus (9090) and Grafana (3000) to be ready
      wait_for:
        port: "{{ item }}"
        delay: 3
        timeout: 60
      loop:
        - 9090
        - 3000
